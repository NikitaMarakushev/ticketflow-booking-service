spring:
  application:
    name: booking-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketflow
    username: ticketflow
    password: ticketflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
  
  data:
    redis:
      host: localhost
      port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      produce: b3
      consume: b3
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      transport: http

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    io.opentelemetry: DEBUG
    com.giffing.bucket4j: DEBUG

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      url: "/api/v1/bookings"
      http-response-body: '{"status": 429, "message": "Too many requests. Please try again later."}'
      rate-limits:
        - expression: "getRemoteAddr()"
          execute-condition: "getRemoteAddr() != null"
          bandwidths:
            - capacity: 5
              time: 1
              unit: minutes